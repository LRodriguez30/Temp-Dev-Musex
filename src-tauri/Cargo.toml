[package]
name = "Musex"
version = "0.3.0"
description = "Musex App"
authors = ["LART"]
edition = "2021"

[lib]
name = "musex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ---------------------------------------------------------------
# COMUNES (desktop + Android)
# ---------------------------------------------------------------
[dependencies]
tauri = { version = "2.12.0", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25.1"
chrono = "0.4.45"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.6.0"
sha2 = "0.10"

# ---------------------------------------------------------------
# SOLO DESKTOP: audio nativo, descargas, ecualizador, Sense,
# servidor de streaming
# ---------------------------------------------------------------
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rodio = "0.22.2"
cpal = "0.18.2"
biquad = "0.6.0"
keyring = "4.2.0"
reqwest = { version = "0.13.4", features = ["blocking", "rustls", "json"] }
tauri-plugin-shell = "2.3.6"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio = { version = "1", features = ["net"] }
local-ip-address = "0.6"
getrandom = "0.2"

# ---------------------------------------------------------------
# SOLO MÓVIL: escáner de QR
# ---------------------------------------------------------------
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
