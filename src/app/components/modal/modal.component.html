@if (open) {
  <div
    class="modal-backdrop fixed inset-0 z-[200] flex items-center justify-center p-4 sm:p-6"
    role="presentation"
    (click)="handleBackdropClick($event)"
  >
    <section
      class="modal-panel flex max-h-[calc(100vh-32px)] w-full max-w-[520px] flex-col overflow-hidden rounded-2xl border border-[#292b2f] bg-[#111214]"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title || 'Ventana de diálogo'"
    >

      <!-- Encabezado -->
      <header
        class="flex shrink-0 items-start justify-between gap-4 border-b border-[#242528] px-5 py-4"
      >
        <div class="min-w-0">
          @if (title) {
            <h2 class="truncate text-base font-semibold text-white">
              {{ title }}
            </h2>
          }

          @if (subtitle) {
            <p class="mt-0.5 text-xs text-zinc-400">
              {{ subtitle }}
            </p>
          }
        </div>

        <!-- Cerrar -->
        <button
          type="button"
          class="icon-btn flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-zinc-400 transition-ui"
          aria-label="Cerrar ventana"
          (click)="close()"
        >
          <svg
            viewBox="0 0 24 24"
            class="h-5 w-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </header>

      <!-- Contenido -->
      <div class="min-h-0 overflow-y-auto p-5">
        <ng-content></ng-content>
      </div>

    </section>
  </div>
}
