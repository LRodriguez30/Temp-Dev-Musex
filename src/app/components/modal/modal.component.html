@if (rendered) {

  <div
    class="
      modal-backdrop
      fixed
      inset-0
      flex
      items-center
      justify-center
      z-[1100]
      overflow-y-auto
      bg-black/65
      p-4
      backdrop-blur-md
      sm:p-6
    "
    [class.is-closing]="closing"
    role="presentation"
    (click)="handleBackdropClick($event)"
  >

    <section
      class="
        modal-panel
        my-auto
        flex
        max-h-[calc(100dvh-32px)]
        w-full
        flex-col
        overflow-hidden
      "
      [class.max-w-[520px]]="!bare"
      [class.rounded-2xl]="!bare"
      [class.border]="!bare"
      [class.border-[#292b2f]]="!bare"
      [class.bg-[#111214]]="!bare"
      [class.modal-panel-bare]="bare"
      [class.is-closing]="closing"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title || 'Ventana de diálogo'"
    >

      @if (!bare) {

        <!-- ===================================================
             HEADER
        ==================================================== -->

        <header
          class="
            flex
            shrink-0
            items-start
            justify-between
            gap-4
            border-b
            border-[#242528]
            px-5
            py-4
          "
        >

          <div class="min-w-0">

            @if (title) {

              <h2
                class="
                  truncate
                  text-base
                  font-semibold
                  text-white
                "
              >
                {{ title }}
              </h2>

            }

            @if (subtitle) {

              <p
                class="
                  mt-0.5
                  text-xs
                  text-zinc-400
                "
              >
                {{ subtitle }}
              </p>

            }

          </div>


          <!-- =================================================
               CLOSE
          ================================================== -->

          <button
            type="button"
            class="
              icon-btn
              flex
              h-9
              w-9
              shrink-0
              items-center
              justify-center
              rounded-full
              text-zinc-400
              transition-ui
            "
            aria-label="Cerrar ventana"
            (click)="close()"
          >

            <svg
              viewBox="0 0 24 24"
              class="h-5 w-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>

          </button>

        </header>

      }


      <!-- =====================================================
           CONTENT
      ====================================================== -->

      <div
        class="
          min-h-0
          flex-1
          overflow-y-auto
          overscroll-contain
        "
        [class.p-5]="!bare"
        [class.modal-content-bare]="bare"
      >
        <ng-content></ng-content>
      </div>

    </section>

  </div>

}
