<article
  class="card group flex min-w-0 cursor-pointer items-center gap-4 rounded-xl border border-transparent bg-[#151719] p-4 transition-ui sm:p-5"
  (click)="openRecommendation()"
>
  <!-- Icono de la recomendación -->
  <div
    class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-[#202326] text-[var(--musex-accent)]"
  >
    <svg
      viewBox="0 0 24 24"
      class="h-5 w-5"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M12 3a9 9 0 1 0 9 9"></path>
      <path d="M12 7v5l3 2"></path>
      <path d="M16 3h5v5"></path>
      <path d="m21 3-5 5"></path>
    </svg>
  </div>

  <!-- Información -->
  <div class="min-w-0 flex-1">
    <h3 class="truncate text-sm font-semibold text-white">
      {{ title }}
    </h3>

    <p class="mt-1 truncate text-xs text-zinc-400">
      {{ subtitle }}
    </p>
  </div>

  <!-- Acción -->
  <button
    type="button"
    class="icon-btn flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-zinc-500 transition-ui"
    [attr.aria-label]="'Abrir ' + title"
    (click)="openRecommendation(); $event.stopPropagation()"
  >
    <svg
      viewBox="0 0 24 24"
      class="h-4 w-4"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m9 18 6-6-6-6"></path>
    </svg>
  </button>
</article>
