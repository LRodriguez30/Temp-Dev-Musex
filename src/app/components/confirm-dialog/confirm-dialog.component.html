
@if (rendered) {
  <div
    class="
      confirm-dialog-backdrop
      fixed
      inset-0
      z-[9999]
      flex
      items-center
      justify-center
      overflow-y-auto
      bg-black/70
      p-4
      pt-[max(1rem,env(safe-area-inset-top))]
      pb-[max(1rem,env(safe-area-inset-bottom))]
      pl-[max(1rem,env(safe-area-inset-left))]
      pr-[max(1rem,env(safe-area-inset-right))]
      backdrop-blur-[2px]
    "
    [class.is-closing]="closing"
    role="presentation"
    (click)="handleBackdropClick($event)"
  >
    <section
      class="
        modal-panel
        flex
        max-h-[calc(100dvh-2rem)]
        w-full
        max-w-[460px]
        flex-col
        overflow-hidden
        rounded-2xl
        border
        border-white/[0.09]
        bg-[#131517]
        shadow-2xl
        sm:max-h-[calc(100dvh-3rem)]
      "
      [class.is-closing]="closing"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-label]="title"
      (click)="$event.stopPropagation()"
    >

      <!-- HEADER / MESSAGE -->

      <header class="flex shrink-0 items-start gap-3 px-5 pt-5">
        <span
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl"
          [class]="danger
            ? 'bg-red-500/10 text-red-300'
            : 'bg-[var(--musex-accent)]/10 text-[var(--musex-accent)]'"
        >
          <svg
            viewBox="0 0 24 24"
            class="h-5 w-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 9v4"></path>
            <path d="M12 17h.01"></path>
            <path d="M10.3 3.8 2.5 17.2A2 2 0 0 0 4.2 20h15.6a2 2 0 0 0 1.7-2.8L13.7 3.8a2 2 0 0 0-3.4 0Z"></path>
          </svg>
        </span>

        <div class="min-w-0 flex-1 pb-1">
          <h2 class="text-[16px] font-semibold text-white">
            {{ title }}
          </h2>

          <p class="mt-1.5 text-[13px] leading-relaxed text-white/60">
            {{ message }}
          </p>
        </div>
      </header>

      <!-- SCROLLABLE CONTENT -->

      <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain px-5 pb-4 pt-3">

        @if (items.length > 0) {
          <ul
            class="
              space-y-1
              rounded-xl
              border
              border-white/[0.06]
              bg-black/20
              p-3
              text-[12px]
              text-white/70
            "
          >
            @for (item of items; track item) {
              <li class="truncate">{{ item }}</li>
            }

            @if (extraCount > 0) {
              <li class="text-white/40">
                y {{ extraCount }} más…
              </li>
            }
          </ul>
        }

        @if (warning) {
          <p
            class="
              mt-4
              rounded-xl
              border
              border-red-400/20
              bg-red-400/[0.06]
              px-3.5
              py-3
              text-[12px]
              leading-relaxed
              text-red-200/90
            "
          >
            {{ warning }}
          </p>
        }

      </div>

      <!-- FIXED ACTIONS -->

      <footer
        class="
          flex
          shrink-0
          gap-2.5
          border-t
          border-white/[0.06]
          px-5
          py-4
        "
      >
        <button
          type="button"
          class="
            h-11
            flex-1
            rounded-xl
            border
            border-white/10
            bg-white/[0.04]
            text-[13px]
            font-medium
            text-white/80
            transition
            active:scale-[0.98]
          "
          (click)="cancel()"
        >
          Cancelar
        </button>

        <button
          type="button"
          class="
            h-11
            flex-1
            rounded-xl
            text-[13px]
            font-semibold
            transition
            active:scale-[0.98]
          "
          [class]="danger
            ? 'bg-red-500 text-white'
            : 'bg-[var(--musex-accent)] text-black'"
          (click)="confirm()"
        >
          {{ confirmLabel }}
        </button>
      </footer>

    </section>
  </div>
}
