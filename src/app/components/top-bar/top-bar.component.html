<!-- ============================================================
     MUSEX — TOP BAR
============================================================= -->

<header class="top-bar">

  <!-- Logo -->

  <div class="top-logo">

    <div class="top-logo-mark">

      <svg
        viewBox="0 0 32 32"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M7 4.8 23.5 9.2 27 14.7 17.4 12 7 17.2V4.8Z"
          stroke="var(--musex-accent)"
          stroke-width="2.5"
          stroke-linejoin="round"
        />

        <path
          d="M7 17.2 17.4 12 27 14.7 18.8 27.2 7 23.8V17.2Z"
          stroke="var(--musex-accent)"
          stroke-width="2.5"
          stroke-linejoin="round"
        />

        <path
          d="M13 15.1 18.2 16.5 15.1 20.8 13 20.1V15.1Z"
          fill="var(--musex-accent)"
        />
      </svg>

    </div>

    <span class="top-logo-name">
      Musex
    </span>

  </div>


  <!-- Buscador -->

  <div class="top-search-area">

    <button
      type="button"
      class="top-search"
      (click)="openSearch()"
      aria-label="Buscar en Musex"
    >

      <span class="top-search-icon">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle
            cx="11"
            cy="11"
            r="7"
          />

          <path d="m20 20-4-4" />
        </svg>

      </span>


      <span class="top-search-placeholder">
        Busca canciones, artistas, álbumes o playlists...
      </span>


      <span class="top-search-shortcut">
        <kbd>Ctrl</kbd>
        <kbd>K</kbd>
      </span>

    </button>

  </div>


  <!-- Acciones -->

  <div class="top-actions">

    <!-- Más (solo móvil) -->

    <button
      type="button"
      class="top-action-button top-more-button max-[620px]:flex"
      [class.is-open]="mobileMenuService.isOpen()"
      [attr.aria-expanded]="mobileMenuService.isOpen()"
      aria-controls="mobile-more-panel"
      aria-label="Más opciones"
      title="Más"
      (click)="mobileMenuService.toggle()"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="5" cy="12" r="1.5" />
        <circle cx="12" cy="12" r="1.5" />
        <circle cx="19" cy="12" r="1.5" />
      </svg>

    </button>
    
    <!-- Notificaciones -->

    <button
      type="button"
      class="top-action-button"
      aria-label="Notificaciones"
      title="Notificaciones"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
        />

        <path
          d="M13.73 21a2 2 0 0 1-3.46 0"
        />
      </svg>

      <span class="notification-dot"></span>

    </button>


    <!-- Perfil local -->

    <button
      type="button"
      class="top-profile"
      (click)="toggleUserMenu()"
      [attr.aria-expanded]="userMenuOpen()"
      aria-haspopup="menu"
      aria-label="Abrir perfil local"
      title="Perfil local"
    >

      <span class="top-profile-avatar">

        LART

        <span class="top-profile-status"></span>

      </span>


      <span class="top-profile-info">

        <span class="top-profile-name">
          LART
        </span>

        <span class="top-profile-role">
          Biblioteca personal
        </span>

      </span>


      <svg
        class="top-profile-chevron"
        [class.is-open]="userMenuOpen()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m6 9 6 6 6-6" />
      </svg>

    </button>

  </div>


    <!-- =========================================================
       MENÚ DE PERFIL LOCAL
       ----------------------------------------------------------
       Desktop: dropdown anclado arriba a la derecha.
       Móvil: bottom sheet (ver top-bar.component.css).
  ========================================================== -->

  @if (userMenuOpen()) {

    <div
      class="user-menu-backdrop max-[620px]:block"
      aria-hidden="true"
      (click)="toggleUserMenu()"
    ></div>

    <div
      class="user-menu"
      role="menu"
      aria-label="Opciones del perfil"
    >

      <!-- Perfil actual -->

      <div class="user-menu-header">

        <span class="user-menu-avatar">
          LART
        </span>

        <div>

          <strong>
            LART
          </strong>

          <span>
            Biblioteca personal
          </span>

        </div>

      </div>


      <div class="user-menu-divider"></div>


      <!-- Cambiar perfil -->

      <button
        type="button"
        class="user-menu-item"
        role="menuitem"
        [attr.aria-expanded]="profileSwitcherOpen()"
        (click)="toggleProfileSwitcher()"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />

          <circle
            cx="9"
            cy="7"
            r="4"
          />

          <path d="M19 8v6" />
          <path d="M22 11h-6" />
        </svg>

        <span>
          Cambiar perfil
        </span>

        <svg
          class="user-menu-item-chevron"
          [class.is-open]="profileSwitcherOpen()"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m6 9 6 6 6-6" />
        </svg>

      </button>


      <!-- ======================================================
           LISTA DE PERFILES
           ------------------------------------------------------
           Interfaz visual del selector de perfiles.
      ======================================================= -->

      @if (profileSwitcherOpen()) {

        <div class="profile-switcher-list">

          @for (profile of availableProfiles(); track profile.id) {

            <button
              type="button"
              class="profile-switcher-item"
              [class.active]="profile.active"
              (click)="selectProfile(profile.id)"
            >

              <span class="profile-switcher-avatar">
                {{ profile.name.slice(0, 2).toUpperCase() }}
              </span>

              <span class="profile-switcher-text">

                <strong>
                  {{ profile.name }}
                </strong>

                <span>
                  {{ profile.subtitle }}
                </span>

              </span>

              @if (profile.active) {

                <svg
                  class="profile-switcher-check"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M20 6 9 17l-5-5" />
                </svg>

              }

            </button>

          }

        </div>

      }


      <!-- Nuevo perfil -->

      <button
        type="button"
        class="user-menu-item"
        role="menuitem"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle
            cx="12"
            cy="8"
            r="4"
          />

          <path d="M4 21a8 8 0 0 1 16 0" />

          <path d="M19 5v6" />
          <path d="M22 8h-6" />
        </svg>

        <span>
          Nuevo perfil
        </span>

      </button>


      <div class="user-menu-divider"></div>


      <!-- Preferencias -->

      <button
        type="button"
        class="user-menu-item"
        role="menuitem"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle
            cx="12"
            cy="12"
            r="3"
          />

          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.42 1.42-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V21h-2v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-1.42-1.42.06-.06A1.7 1.7 0 0 0 9.4 15a1.7 1.7 0 0 0-1.55-1H7v-2h.85A1.7 1.7 0 0 0 9.4 11a1.7 1.7 0 0 0-.34-1.88L9 9.06l1.42-1.42.06.06A1.7 1.7 0 0 0 12.36 8a1.7 1.7 0 0 0 1-1.55V6h2v.45A1.7 1.7 0 0 0 16.36 8a1.7 1.7 0 0 0 1.88-.34l.06-.06 1.42 1.42-.06.06A1.7 1.7 0 0 0 19.4 11a1.7 1.7 0 0 0 1.55 1H22v2h-1.05A1.7 1.7 0 0 0 19.4 15Z"
          />
        </svg>

        <span>
          Preferencias
        </span>

      </button>


      <!-- Almacenamiento -->

      <button
        type="button"
        class="user-menu-item"
        role="menuitem"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 19h16" />
          <path d="M6 19V8h12v11" />
          <path d="M9 8V5h6v3" />
          <path d="M9 12h6" />
          <path d="M9 15h6" />
        </svg>

        <span>
          Almacenamiento
        </span>

      </button>


      <div class="user-menu-divider"></div>


      <!-- Cerrar aplicación -->

      <button
        type="button"
        class="user-menu-item user-menu-danger"
        role="menuitem"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 21h6" />
          <path d="M12 3v14" />
          <path d="m7 12 5 5 5-5" />
        </svg>

        <span>
          Cerrar Musex
        </span>

      </button>

    </div>

  }

</header>
