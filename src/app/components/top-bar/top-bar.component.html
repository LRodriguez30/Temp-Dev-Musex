<!-- ============================================================
     MUSEX — TOP BAR
============================================================= -->

<header class="top-bar">

  <!-- Logo -->

  <div class="top-logo">

    <div class="top-logo-mark">

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="318 345 638 547"
        width="638"
        height="547"
      >
        <g
          fill="none"
          stroke="var(--musex-accent)"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M 350 608 V 640" />

          <path d="M 412 560 V 688" />

          <path d="M 472 476 V 772" />

          <path d="M 534 416 V 830" />

          <path d="M 595 560 V 688" />

          <path d="
            M 579 374
            L 909 583
            C 939 602 939 639 909 658
            L 579 863
            C 558 876 534 861 534 836
            V 400
            C 534 375 558 361 579 374
            Z
          " />
        </g>
      </svg>

    </div>

    <span class="top-logo-name">
      Musex
    </span>

  </div>


  <!-- Buscador -->

  <div class="top-search-area">

    <button
      type="button"
      class="top-search"
      (click)="openSearch()"
      aria-label="Buscar en Musex"
    >

      <span class="top-search-icon">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle
            cx="11"
            cy="11"
            r="7"
          />

          <path d="m20 20-4-4" />
        </svg>

      </span>


      <span class="top-search-placeholder">
        Busca canciones, artistas, álbumes o playlists...
      </span>


      <span class="top-search-shortcut">
        <kbd>Ctrl</kbd>
        <kbd>K</kbd>
      </span>

    </button>

  </div>


  <!-- Acciones -->

  <div class="top-actions">

    <!-- Más (solo móvil) -->

    <button
      type="button"
      class="top-action-button top-more-button"
      [class.is-open]="mobileMenuService.isOpen()"
      [attr.aria-expanded]="mobileMenuService.isOpen()"
      aria-controls="mobile-more-panel"
      aria-label="Más opciones"
      title="Más"
      (click)="mobileMenuService.toggle()"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="5" cy="12" r="1.5" />
        <circle cx="12" cy="12" r="1.5" />
        <circle cx="19" cy="12" r="1.5" />
      </svg>

    </button>
  
  </div>

</header>
