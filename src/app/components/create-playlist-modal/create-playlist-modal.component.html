<app-modal
  [open]="true"
  title="Nueva playlist"
  subtitle="Elige un nombre y una portada"
  (closed)="cancel()"
>

  <!-- Nombre -->
  <label class="block">
    <span class="text-xs font-medium uppercase tracking-wide text-zinc-500">
      Nombre
    </span>

    <input
      type="text"
      [(ngModel)]="name"
      name="playlistName"
      placeholder="Mi playlist"
      class="mt-2 w-full rounded-lg border border-[#292b30] bg-[#0d0e10] px-4 py-3 text-sm text-white outline-none transition-ui placeholder:text-zinc-600 focus:border-[var(--musex-accent)]"
    />
  </label>


  <!-- Tipo de portada -->
  <div class="mt-5 flex gap-2">
    <button
      type="button"
      class="flex-1 rounded-lg border px-4 py-2 text-sm font-medium transition-ui"
      [class.border-[var(--musex-accent)]]="coverType === 'icon'"
      [class.text-[var(--musex-accent)]]="coverType === 'icon'"
      [class.border-[#292b30]]="coverType !== 'icon'"
      [class.text-zinc-400]="coverType !== 'icon'"
      (click)="selectIconMode()"
    >
      Ícono
    </button>

    <button
      type="button"
      class="flex-1 rounded-lg border px-4 py-2 text-sm font-medium transition-ui"
      [class.border-[var(--musex-accent)]]="coverType === 'image'"
      [class.text-[var(--musex-accent)]]="coverType === 'image'"
      [class.border-[#292b30]]="coverType !== 'image'"
      [class.text-zinc-400]="coverType !== 'image'"
      (click)="selectImageMode()"
    >
      Imagen
    </button>
  </div>


  @if (coverType === 'icon') {

    <!-- Preview -->
    <div class="mt-5 flex items-center justify-center">
      <div
        class="flex h-20 w-20 items-center justify-center rounded-xl"
        [style.background]="selectedColor + '1a'"
      >
        <svg viewBox="0 0 24 24" class="h-9 w-9" fill="none" [attr.stroke]="selectedColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path [attr.d]="getIconPath(selectedIcon)"></path>
        </svg>
      </div>
    </div>

    <!-- Íconos -->
    <div class="mt-4 grid grid-cols-6 gap-2">
      @for (icon of icons; track icon.id) {
        <button
          type="button"
          class="flex h-10 items-center justify-center rounded-lg border transition-ui"
          [class.border-[var(--musex-accent)]]="selectedIcon === icon.id"
          [class.border-[#292b30]]="selectedIcon !== icon.id"
          (click)="chooseIcon(icon.id)"
        >
          <svg viewBox="0 0 24 24" class="h-4 w-4 text-zinc-300" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path [attr.d]="icon.path"></path>
          </svg>
        </button>
      }
    </div>

    <!-- Colores -->
    <div class="mt-3 flex flex-wrap gap-2">
      @for (color of colors; track color) {
        <button
          type="button"
          class="h-8 w-8 shrink-0 rounded-full border-2 transition-ui"
          [style.background]="color"
          [class.border-white]="selectedColor === color"
          [class.border-transparent]="selectedColor !== color"
          (click)="chooseColor(color)"
          [attr.aria-label]="'Color ' + color"
        ></button>
      }
    </div>

  } @else {

    <!-- Selección de imagen -->
    <div class="mt-5 flex flex-col items-center gap-4">

      @if (imagePreview) {
        <img [src]="imagePreview" alt="Vista previa" class="h-32 w-32 rounded-xl object-cover" />
      } @else {
        <div class="flex h-32 w-32 items-center justify-center rounded-xl border border-dashed border-[#292b30] text-zinc-600">
          Sin imagen
        </div>
      }

      <label class="cursor-pointer rounded-lg border border-[#292b30] px-4 py-2 text-sm text-zinc-300 transition-ui hover:border-[#3a3d42] hover:text-white">
        Elegir imagen
        <input type="file" accept="image/*" class="hidden" (change)="onImageSelected($event)" />
      </label>

    </div>

  }


  <!-- Confirmar -->
  <button
    type="button"
    [disabled]="!name.trim()"
    class="transition-ui mt-6 flex h-11 w-full items-center justify-center rounded-lg bg-[var(--musex-accent)] text-sm font-semibold text-black hover:brightness-105 disabled:cursor-not-allowed disabled:opacity-40"
    (click)="submit()"
  >
    Crear playlist
  </button>

</app-modal>
