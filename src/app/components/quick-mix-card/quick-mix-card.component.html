<article
  class="card group relative min-w-0 cursor-pointer overflow-hidden rounded-xl border border-transparent bg-[#151719] p-4 transition-ui sm:p-5"
  (click)="playMix()"
>
  <!-- Contenido principal del mix -->
  <div class="flex min-h-[150px] flex-col justify-between sm:min-h-[165px]">

    <!-- Identificador visual -->
    <div
      class="flex h-10 w-10 items-center justify-center rounded-lg bg-[#202326] text-[var(--musex-accent)]"
    >
      <svg
        viewBox="0 0 24 24"
        class="h-5 w-5"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M9 18V5l10-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="16" cy="16" r="3"></circle>
      </svg>
    </div>

    <!-- Información -->
    <div class="mt-6 min-w-0">
      <h3 class="truncate text-sm font-semibold text-white sm:text-base">
        {{ title }}
      </h3>

      <p class="mt-1 truncate text-xs text-zinc-400">
        {{ subtitle }}
      </p>
    </div>
  </div>

  <!-- Acción de reproducción -->
  <button
    type="button"
    class="absolute bottom-4 right-4 flex h-9 w-9 translate-y-1 items-center justify-center rounded-full bg-[var(--musex-accent)] text-black opacity-0 transition-ui group-hover:translate-y-0 group-hover:opacity-100"
    [attr.aria-label]="'Reproducir ' + title"
    (click)="playMix(); $event.stopPropagation()"
  >
    <svg
      viewBox="0 0 24 24"
      class="ml-0.5 h-4 w-4"
      fill="currentColor"
      aria-hidden="true"
    >
      <path d="M8 5.5v13l10-6.5z"></path>
    </svg>
  </button>
</article>
